<main class="app-shell">
  <app-header
    (StateConfigTrue)="configState = !!$event"
    (showUserProfile)="userProfileState = !!$event"
    (menuClick)="setNavOpen(!navOpen)"
    />

  <div class="app-body">
    <app-nav [open]="navOpen" (closeNav)="setNavOpen(false)" />

    <div class="app-content">
      <router-outlet></router-outlet>
    </div>
  </div>

  @if (configState) {
    <app-user-config
      (StateConfigFalse)="configState = !!$event"
      />
  }

  <!-- Modal del perfil de usuario -->
  @if (userProfileState) {
    <app-user-profile
      [user]="usuario"
      (closeProfile)="userProfileState = false">
    </app-user-profile>
  }
</main>
