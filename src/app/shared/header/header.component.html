<header class="navbar sticky-navbar">
    <button type="button" class="menu-btn mobile-only" (click)="menuClick.emit()" aria-label="Abrir menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
    </button>

    <div class="logoContainer clickable" (click)="goToGallery()" role="link" tabindex="0" aria-label="Ir a mi galería"
        (keydown.enter)="goToGallery()">
        <span class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="4" ry="4"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
            </svg>
        </span>
        <span class="logo-title">TeleDrive</span>
    </div>

    <!-- Barra de búsqueda global -->
    <div class="search-box" role="search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="search-input" placeholder="Busca tus archivos, fotos y videos..."
            aria-label="Buscar archivos" [(ngModel)]="searchTerm" (ngModelChange)="onSearch()">
        <button type="button" class="search-clear" *ngIf="searchTerm" (click)="clearSearch()"
            aria-label="Limpiar búsqueda">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>

    <div class="nav-icons">
        <button type="button" class="icon-button" (click)="toggleTheme()"
            [attr.aria-label]="isLight ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
            [title]="isLight ? 'Modo oscuro' : 'Modo claro'">
            <svg *ngIf="!isLight" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M18.36 5.64l1.41-1.41"/>
            </svg>
            <svg *ngIf="isLight" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        </button>
        <app-settings-menu></app-settings-menu>
    </div>
</header>
