<!-- Navbar Superior -->
<header class="navbar sticky-navbar">
    <div class="logoContainer clickable" (click)="goToGallery()" role="link" tabindex="0" aria-label="Ir a mi galería"
        (keydown.enter)="goToGallery()">
        <span class="brand-mark"><mat-icon>image</mat-icon></span>
        <span class="logo-title">TeleDrive</span>
    </div>

    <!-- Barra de búsqueda global, ancha y prominente, centrada -->
    <div class="search-box" role="search">
        <mat-icon class="search-icon" fontSet="material-icons">search</mat-icon>
        <input type="text" class="search-input" placeholder="Busca tus archivos, fotos y videos..."
            aria-label="Buscar archivos" [(ngModel)]="searchTerm" (ngModelChange)="onSearch()">
        <button type="button" class="search-clear" *ngIf="searchTerm" (click)="clearSearch()"
            aria-label="Limpiar búsqueda">
            <mat-icon fontSet="material-icons">close</mat-icon>
        </button>
    </div>

    <div class="nav-icons">
        <button type="button" class="icon-button" (click)="toggleTheme()"
            [attr.aria-label]="isLight ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'"
            [title]="isLight ? 'Modo oscuro' : 'Modo claro'">
            <mat-icon>{{ isLight ? 'dark_mode' : 'light_mode' }}</mat-icon>
        </button>
        <app-settings-menu></app-settings-menu>
    </div>
</header>
