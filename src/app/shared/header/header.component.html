<!-- Navbar Superior -->
<header class="navbar sticky-navbar">
    <div class="logoContainer clickable" (click)="goToGallery()">
        <img src="../../assets/Log.png" alt="Logo">
        <span class="logo-title">TeleDrive</span>
    </div>

    <!-- Barra de búsqueda global, ancha y prominente, centrada -->
    <div class="search-box" role="search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" class="search-input" placeholder="Busca tus archivos, fotos y videos..."
            aria-label="Buscar archivos" [(ngModel)]="searchTerm" (ngModelChange)="onSearch()">
        <button type="button" class="search-clear" *ngIf="searchTerm" (click)="clearSearch()"
            aria-label="Limpiar búsqueda">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
    </div>

    <div class="nav-icons">
        <app-settings-menu></app-settings-menu>
    </div>
</header>
