<aside class="sidebar" aria-label="Navegación principal">

    <div class="sidebar-section">
        <button type="button" class="sidebar-item" (click)="goToLanding()">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z" />
            </svg>
            <span>Inicio</span>
        </button>

        <button type="button" class="sidebar-item" [class.active]="active === 'galeria'" (click)="goToGallery()">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <rect x="3" y="3" width="7" height="9" rx="1" />
                <rect x="14" y="3" width="7" height="5" rx="1" />
                <rect x="14" y="12" width="7" height="9" rx="1" />
                <rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
            <span>Mi Galería</span>
        </button>
    </div>

    <div class="sidebar-section sidebar-categories">
        <p class="sidebar-label">Categorías</p>

        <button type="button" class="sidebar-item" [class.active]="active === 'imagenes'" (click)="openCategory('Imagenes')">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
            </svg>
            <span>Imágenes</span>
        </button>

        <button type="button" class="sidebar-item" [class.active]="active === 'video'" (click)="openCategory('Video')">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <polygon points="23 7 16 12 23 17 23 7" />
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
            </svg>
            <span>Video</span>
        </button>

        <button type="button" class="sidebar-item" [class.active]="active === 'audio'" (click)="openCategory('Audio')">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
            </svg>
            <span>Audio</span>
        </button>

        <button type="button" class="sidebar-item" [class.active]="active === 'documentos'" (click)="openCategory('Documentos')">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="8" y1="13" x2="16" y2="13" />
                <line x1="8" y1="17" x2="16" y2="17" />
            </svg>
            <span>Documentos</span>
        </button>
    </div>

    <div class="sidebar-footer">
        <div class="sidebar-user" *ngIf="userPhone">
            <span class="sidebar-user-phone">Cuenta: {{ userPhone }}</span>
        </div>
        <button type="button" class="sidebar-item sidebar-logout" (click)="logout()">
            <svg class="sidebar-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Cerrar sesión</span>
        </button>
    </div>
</aside>
