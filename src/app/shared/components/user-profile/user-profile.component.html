<div class="user-profile-overlay" role="dialog" aria-modal="true" aria-labelledby="userProfileTitle">
    <div class="modal-content user-profile-box">
  
      <!-- Avatar circular con ícono -->
      <div class="avatar-container">
        <img src="../../assets/profile.svg" alt="Avatar de usuario" class="avatar-img">
      </div>
  
      <h2 id="userProfileTitle">Perfil de Usuario</h2>
  
      <div class="profile-info">
        <p><strong>Nombre:</strong> {{ user?.name }}</p>
        <p><strong>Correo:</strong> {{ user?.email }}</p>
      </div>
  
      <button class="close-btn" (click)="close()">Cerrar</button>
    </div>
  </div>
