<main class="app-shell">
    <app-header
        (StateConfigTrue)="configState = $event"
        (showUserProfile)="userProfileState = $event"
    />

    <div class="app-body">
        <app-nav />

        <div class="app-content">
            <router-outlet></router-outlet>
        </div>
    </div>

    <app-user-config
        *ngIf="configState"
        (StateConfigFalse)="configState = $event"
    />

    <!-- Modal del perfil de usuario -->
    <app-user-profile
        *ngIf="userProfileState"
        [user]="usuario"
        (closeProfile)="userProfileState = false">
    </app-user-profile>
</main>
