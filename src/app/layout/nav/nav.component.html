<!-- Scrim móvil -->
<div class="sidebar-scrim" *ngIf="open" (click)="close()" aria-hidden="true"></div>

<aside class="sidebar" [class.open]="open" aria-label="Navegación principal">

    <!-- Botón cerrar móvil -->
    <button type="button" class="sidebar-close mobile-only" (click)="close()" aria-label="Cerrar menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
    </button>

    <div class="sidebar-inner">
        <div class="sidebar-section">
            <button type="button" class="sidebar-item" [class.active]="active === 'inicio'" (click)="goToHome()">
                <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="7" height="7" x="3" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="3" rx="1"/>
                    <rect width="7" height="7" x="14" y="14" rx="1"/>
                    <rect width="7" height="7" x="3" y="14" rx="1"/>
                </svg>
                <span>Inicio</span>
            </button>

            <button type="button" class="sidebar-item" [class.active]="active === 'galeria'" (click)="goToGallery()">
                <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                <span>Mi galería</span>
            </button>
        </div>

        <div class="sidebar-section sidebar-categories">
            <p class="sidebar-label">CATEGORÍAS</p>

            <button type="button" class="sidebar-item" [class.active]="active === 'imagenes'" (click)="openCategory('Imagenes')">
                <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                    <circle cx="9" cy="9" r="2"/>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                </svg>
                <span>Imágenes</span>
            </button>

            <button type="button" class="sidebar-item" [class.active]="active === 'video'" (click)="openCategory('Video')">
                <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m22 8-6 4 6 4V8Z"/>
                    <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
                </svg>
                <span>Videos</span>
            </button>

            <button type="button" class="sidebar-item" [class.active]="active === 'audio'" (click)="openCategory('Audio')">
                <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>
                <span>Audio</span>
            </button>

            <button type="button" class="sidebar-item" [class.active]="active === 'documentos'" (click)="openCategory('Documentos')">
                <svg class="sidebar-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span>Documentos</span>
            </button>
        </div>
    </div>

    <div class="sidebar-footer">
        <div class="storage-mini">
            <div class="storage-head">
                <span>Almacenamiento</span>
                <strong>{{ usageLabel }}</strong>
            </div>
            <div class="progress"><span [style.width.%]="usagePercent"></span></div>
            <small>de 2 GB utilizados</small>
        </div>

        <div class="user-row">
            <div class="avatar">{{ avatar }}</div>
            <div class="user-row-info">
                <strong>{{ username }}</strong>
                <small>Cuenta personal</small>
            </div>
        </div>

        <button type="button" class="sidebar-item sidebar-logout" (click)="logout()">
            <svg class="sidebar-icon logout-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Cerrar sesión</span>
        </button>
    </div>
</aside>
