# Configuración de pnpm (pnpm >=10 lee los overrides SOLO desde este archivo).
# pnpm 9 los lee SOLO de "pnpm.overrides" en package.json: por eso la misma
# regla debe existir en ambos archivos con valor byte-idéntico, para que la
# instalación frozen de CI/Vercel no falle con ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
  typescript: ~5.1.6

# Control de scripts de build:
#  - pnpm 10 (legacy) lee "onlyBuiltDependencies" (lista).
#  - pnpm 11/12 leen "allowBuilds" (mapa de nombre -> booleano).
# Se declaran AMBOS con el mismo conjunto de paquetes para que cualquier
# versión de pnpm que use el CI apruebe la ejecución de estos scripts y no
# falle con ERR_PNPM_IGNORED_BUILDS (esbuild y nice-napi se necesitan para
# el build de Angular; opencode-ai es dependencia directa del proyecto).
onlyBuiltDependencies:
  - esbuild
  - nice-napi
  - opencode-ai

allowBuilds:
  esbuild: true
  nice-napi: true
  opencode-ai: true