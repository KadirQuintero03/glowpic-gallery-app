# Configuración de pnpm (pnpm >=10 lee los overrides SOLO desde este archivo).
# pnpm 9 los lee SOLO de "pnpm.overrides" en package.json: por eso la misma
# regla debe existir en ambos archivos con valor byte-idéntico, para que la
# instalación frozen de CI/Vercel no falle con ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
overrides:
  typescript: ~5.1.6

# pnpm >=10 bloquea por defecto los scripts de build de dependencias. Angula
# necesita esbuild y el proyecto declara opencode-ai; hay que autorizarlos
# explícitamente o la instalación falla con ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - esbuild
  - opencode-ai